<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2d4a2b">
  <title>Native Sons — Quick Availability</title>
  <meta name="description" content="Fast, text-only availability list. Botanical name, common name, size, height, width, and price.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Native Sons">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --c-bark: #2d4a2b;
      --c-paper: #f7f4ec;
      --c-line: #d8d2c2;
      --c-muted: #6b6256;
      --c-ink: #1a2e1a;
      --c-clay: #4a4438;
      --c-cta: #3a5f3a;
      --font-serif: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono: "SF Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      color: var(--c-ink);
      background: #fafaf5;
      min-height: 100vh;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }

    header.page {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--c-line);
    }

    header.page h1 {
      font-size: 22px;
      font-weight: 600;
      color: var(--c-bark);
      margin: 0;
      letter-spacing: -0.01em;
    }

    header.page .meta {
      font-size: 12px;
      color: var(--c-muted);
    }

    header.page a.nav-back {
      font-size: 12px;
      color: var(--c-cta);
      text-decoration: none;
    }
    header.page a.nav-back:hover { text-decoration: underline; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }

    .toolbar input[type="search"] {
      flex: 1 1 240px;
      min-width: 200px;
      padding: 8px 12px;
      font-size: 14px;
      font-family: var(--font-sans);
      color: var(--c-ink);
      background: #fff;
      border: 1px solid var(--c-line);
      border-radius: 6px;
      outline: none;
    }
    .toolbar input[type="search"]:focus {
      border-color: var(--c-cta);
      box-shadow: 0 0 0 2px rgba(58,95,58,0.15);
    }

    .toolbar .count {
      font-size: 12px;
      color: var(--c-muted);
      white-space: nowrap;
    }

    table.list {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      line-height: 1.55;
      background: #fff;
      border: 1px solid var(--c-line);
      border-radius: 6px;
      overflow: hidden;
    }

    table.list thead th {
      text-align: left;
      font-weight: 500;
      color: var(--c-muted);
      background: #f3efe2;
      padding: 12px 16px;
      border-bottom: 1px solid var(--c-line);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      position: sticky;
      top: 0;
    }
    table.list thead th:hover { background: #ebe6d4; }
    table.list thead th .arrow { color: var(--c-muted); margin-left: 4px; font-size: 10px; }
    /* Centered Status column — match the cell alignment */
    table.list thead th[data-sort="status"] { text-align: center; }

    table.list tbody td {
      padding: 10px 16px;
      border-bottom: 1px solid #efeada;
      vertical-align: middle;
    }
    table.list tbody tr:last-child td { border-bottom: 0; }
    table.list tbody tr:nth-child(even) td { background: #fbfaf3; }
    table.list tbody tr:hover td { background: #f4f0df; }

    td.botanical {
      font-style: italic;
      color: var(--c-bark);
      font-weight: 400;
      white-space: nowrap;
    }
    td.botanical a.plant-link {
      color: var(--c-bark);
      text-decoration: none;
      border-bottom: 1px dotted var(--c-line);
    }
    td.botanical a.plant-link:hover {
      color: var(--c-cta, #3a5f3a);
      border-bottom-color: var(--c-cta, #3a5f3a);
    }
    td.size, td.height, td.width {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--c-clay);
      white-space: nowrap;
    }
    /* Consolidated size cell — one row per plant, with all available
       sizes in a single cell as '1gal $8.00 / 2gal $12.00 / 5gal $24.00'.
       Each size is its own span; the per-entry weight is set inline via
       --price-weight so the eye lands on the smallest container first. */
    td.size .size-entry {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
    }
    td.size .size-unit {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--c-clay);
    }
    td.size .size-amount {
      font-weight: var(--price-weight, 700);
      color: var(--c-bark);
      font-variant-numeric: tabular-nums;
    }
    td.size .size-sep {
      display: inline-block;
      margin: 0 6px;
      color: var(--c-line);
      font-weight: 400;
    }
    td.size .size-value { color: var(--c-muted); }
    td.price {
      text-align: right;
      font-family: var(--font-mono);
      font-weight: 600;
      color: var(--c-bark);
      font-size: 14px;
      white-space: nowrap;
    }
    td.status {
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
      padding: 8px 12px;
    }
    td.status img.bloom-icon {
      display: inline-block;
      width: 22px;
      height: 22px;
      object-fit: contain;
      vertical-align: middle;
      line-height: 1;
      /* Force the cell to reserve at least the icon width + 16px on each
         side so centering is visually obvious (otherwise the cell
         collapses to icon-width and the icon appears flush-left). */
      margin: 0 16px;
    }
    @media (max-width: 720px) {
      td.status img.bloom-icon { width: 26px; height: 26px; }
    }
    td.section {
      font-size: 11px;
      color: var(--c-muted);
      white-space: nowrap;
    }

    .empty {
      padding: 32px;
      text-align: center;
      color: var(--c-muted);
      font-size: 13px;
    }

    footer.page {
      margin-top: 24px;
      font-size: 11px;
      color: var(--c-muted);
      text-align: right;
    }

    @media (max-width: 720px) {
      .wrap { padding: 16px 8px 48px; }
      table.list { font-size: 12px; }
      table.list thead th, table.list tbody td { padding: 6px 8px; }
      td.common, td.section { display: none; }
    }

    /* === Pricing gate (mirror availability.html) ===
       Banner up top is always the CTA. Per-row "Sign in for pricing"
       is suppressed — visitors see no price column rather than a
       placeholder in every row. */
    body.pricing-locked #rows td.price { display: none; }
    body.pricing-locked thead th[data-sort="price"] { display: none; }
    /* Legacy single-row placeholder rule (kept for any future per-cell use) */
    body.pricing-locked td.price > .price-value { display: none; }

    .pricing-banner {
      display: none;
      padding: 10px 14px;
      margin-bottom: 12px;
      background: #fff8e1;
      border: 1px solid #e8d9a0;
      border-radius: 6px;
      font-size: 13px;
      color: var(--c-clay);
    }
    body.pricing-locked .pricing-banner { display: block; }
    .pricing-banner a {
      color: var(--c-cta, #3a5f3a);
      font-weight: 500;
      text-decoration: none;
      margin-left: 4px;
    }
    .pricing-banner a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="page">
      <h1>Quick Availability</h1>
      <div>
        <a class="nav-back" href="./availability.html">← Full search</a>
        <span class="meta" id="meta">Loading…</span>
      </div>
    </header>

    <div class="pricing-banner" id="pricingBanner">
      Wholesale prices are hidden until your trade account is verified.
      <a href="./availability.html">Verify trade pricing →</a>
    </div>

    <div class="toolbar">
      <input type="search" id="q" placeholder="Filter by botanical name…" autocomplete="off" spellcheck="false">
      <span class="count" id="count"></span>
    </div>

    <table class="list" id="t">
      <thead>
        <tr>
          <th data-sort="botanical">Botanical<span class="arrow"></span></th>
          <th data-sort="status" class="col-status">Status<span class="arrow"></span></th>
          <th data-sort="size">Size<span class="arrow"></span></th>
          <th data-sort="height">Height<span class="arrow"></span></th>
          <th data-sort="width">Width<span class="arrow"></span></th>
          <th data-sort="price" style="text-align:right">Price<span class="arrow"></span></th>
          <th data-sort="section" class="col-staff">Section<span class="arrow"></span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No plants match your filter.</div>

    <footer class="page" id="foot"></footer>
  </div>

  <script>
    // ===== Staff gate =====
    const STAFF = new URLSearchParams(location.search).get('staff') === '1';
    if (!STAFF) {
      document.querySelectorAll('.col-staff').forEach(el => el.style.display = 'none');
    }

    // ===== Pricing gate =====
    // Mirror availability.html: hide wholesale prices for unverified visitors.
    // Storage key + 90-day expiry are the source of truth on the main page;
    // this page just reads them and re-applies the same CSS hook.
    const PRICING_KEY = 'ns_pricing_verified';
    const PRICING_EXPIRY_DAYS = 90;
    const isTradeVerified = () => {
      try {
        const raw = localStorage.getItem(PRICING_KEY);
        if (!raw) return false;
        const data = JSON.parse(raw);
        if (!data || !data.email || !data.expiresAt) return false;
        if (Date.now() > data.expiresAt) {
          localStorage.removeItem(PRICING_KEY);
          return false;
        }
        return true;
      } catch (e) { return false; }
    };
    // Staff mode always bypasses the gate.
    const pricingLocked = !STAFF && !isTradeVerified();
    if (pricingLocked) {
      document.body.classList.add('pricing-locked');
    }

    // ===== Data load =====
    // availability_data.js sets: window.AVAILABILITY = { week, generated, source, contact, plants: [...] }
    const script = document.createElement('script');
    script.src = 'availability_data.js?v=' + Date.now();
    script.onload = init;
    script.onerror = () => {
      document.getElementById('meta').textContent = 'Failed to load availability_data.js';
      document.getElementById('rows').innerHTML = '<tr><td colspan="7" class="empty">Could not load data. Check that availability_data.js exists in the same directory.</td></tr>';
    };
    document.head.appendChild(script);

    let ALL_ROWS = [];
    let SORT_KEY = 'botanical';
    let SORT_DIR = 1;

    function init() {
      const data = window.AVAILABILITY || {};
      const week = data.week || '';
      const generated = data.generated || '';
      const contact = data.contact || '';
      const contactStr = typeof contact === 'string' ? contact : (contact?.name || contact?.email || '');
      const plants = Array.isArray(data.plants) ? data.plants : [];

      for (const p of plants) {
        const sizes = (p.sizes || []).filter(s => s && s.container && typeof s.price === 'number');
        // Status flag: bloom uses the poppy icon. Bud and new are
        // intentionally not displayed here — the user asked for the
        // poppy icon only. (sortKey still ranks bloom rows first.)
        // Empty status gets a non-breaking space so the cell reserves
        // column width even when no icon is present.
        const status = p.bloom
          ? '<img src="popppy-flower.png" alt="" class="bloom-icon" aria-hidden="true">'
          : ' ';
        // Consolidate sizes into a single cell. Sorted smallest-to-largest
        // for a predictable read. Renders as '1gal $8.00 / 2gal $12.00 / 5gal $24.00'
        // with the smallest container's price in bold so the cheapest entry
        // is the visual anchor. Empty sizes get a dash.
        const SIZE_ORDER = ['4in', '4"', '3in', '3"', '1gal', '2gal', '5gal', '7gal', '10gal', '15gal', '25gal', 'ea'];
        const sizeKey = (s) => {
          const c = (s.container || '').toLowerCase().replace(/\s+/g, '');
          const i = SIZE_ORDER.indexOf(c);
          return i === -1 ? 999 : i;
        };
        const sortedSizes = [...sizes].sort((a, b) => sizeKey(a) - sizeKey(b));
        // Weights: 800 (cheapest) -> 700 -> 600 -> 500+ for the rest, so
        // the eye lands on the smallest container first. Matches the
        // B-pass treatment on the main grid's result cards.
        // When trade pricing is locked, suppress the per-size dollar amount
        // so the size column shows just container sizes ("5gal / 1gal") with
        // no inline $X.XX leaking through.
        const showAmount = !pricingLocked;
        const weights = [800, 700, 600, 500, 500];
        const sizeCell = sortedSizes.length === 0
          ? '<span class="size-value">—</span>'
          : sortedSizes.map((s, i) => {
              const w = weights[Math.min(i, weights.length - 1)];
              return `<span class="size-entry" style="--price-weight: ${w};">` +
                `<span class="size-unit">${esc(s.container)}</span>` +
                (showAmount ? `<span class="size-amount">$${s.price.toFixed(2)}</span>` : '') +
                `</span>`;
            }).join(' <span class="size-sep">/</span> ');
        // Cheapest price for sort. null if no sizes.
        const cheapestPrice = sortedSizes.length
          ? Math.min(...sortedSizes.map(s => s.price))
          : null;
        ALL_ROWS.push({
          botanical: p.botanical || '',
          sizes: sortedSizes,
          sizeCell,
          height: p.height || '',
          width: p.width || '',
          price: cheapestPrice,
          status,
          statusOrder: p.bloom ? 1 : (p.bud ? 2 : (p.new ? 3 : 4)),
          section: p.section || '',
        });
      }

      const meta = [];
      if (week) meta.push(week);
      if (generated) meta.push('Generated ' + generated);
      document.getElementById('meta').textContent = meta.join(' · ');
      document.getElementById('foot').textContent = [
        plants.length + ' plants',
        ALL_ROWS.length + ' rows',
        contactStr ? 'Contact: ' + contactStr : '',
        STAFF ? 'Staff view' : '',
      ].filter(Boolean).join(' · ');

      document.getElementById('q').addEventListener('input', render);
      document.querySelectorAll('thead th[data-sort]').forEach(th => {
        th.addEventListener('click', () => {
          const k = th.getAttribute('data-sort');
          if (SORT_KEY === k) SORT_DIR *= -1;
          else { SORT_KEY = k; SORT_DIR = 1; }
          render();
        });
      });

      render();
    }

    function sortKey(row) {
      switch (SORT_KEY) {
        case 'price': return row.price == null ? Infinity : row.price;
        // 'size' column is consolidated (one cell with '1gal $8 / 2gal $12 / 5gal $24')
        // so we sort by the smallest container's price instead, which is the
        // most useful ordering when a plant has multiple sizes.
        case 'size': return row.price == null ? Infinity : row.price;
        case 'status': return row.statusOrder;
        default: return (row[SORT_KEY] || '').toLowerCase();
      }
    }

    function render() {
      const q = (document.getElementById('q').value || '').trim().toLowerCase();
      const filtered = q
        ? ALL_ROWS.filter(r =>
            (r.botanical || '').toLowerCase().includes(q))
        : ALL_ROWS.slice();

      filtered.sort((a, b) => {
        const av = sortKey(a), bv = sortKey(b);
        if (av < bv) return -1 * SORT_DIR;
        if (av > bv) return 1 * SORT_DIR;
        return 0;
      });

      document.querySelectorAll('thead th[data-sort] .arrow').forEach(el => el.textContent = '');
      const active = document.querySelector('thead th[data-sort="' + SORT_KEY + '"] .arrow');
      if (active) active.textContent = SORT_DIR === 1 ? '▲' : '▼';

      const tbody = document.getElementById('rows');
      const empty = document.getElementById('empty');
      const count = document.getElementById('count');

      if (filtered.length === 0) {
        tbody.innerHTML = '';
        empty.hidden = false;
      } else {
        empty.hidden = true;
        const html = filtered.map(r => {
          const priceCell = r.price == null
            ? '<span class="price-value">—</span>'
            : '<span class="price-value">$' + r.price.toFixed(2) + '</span>';
          // Build the cell — botanical is a link to the main portal
          // with the plant name prefilled, so staff can scan the
          // compact list and one-click into the order flow.
          const plantLink = '<a class="plant-link" href="availability.html?plant=' +
            encodeURIComponent(r.botanical) +
            '" title="Open in the full search to add to an order">' +
            esc(r.botanical) + '</a>';
          return '<tr>' +
            '<td class="botanical" data-label="Botanical">' + plantLink + '</td>' +
            '<td class="status" data-label="Status">' + r.status + '</td>' +
            '<td class="size" data-label="Size">' + r.sizeCell + '</td>' +
            '<td class="height" data-label="Height">' + esc(r.height) + '</td>' +
            '<td class="width" data-label="Width">' + esc(r.width) + '</td>' +
            '<td class="price" data-label="Price from">' + priceCell + '</td>' +
            '<td class="section col-staff" data-label="Section" style="' + (STAFF ? '' : 'display:none') + '">' + esc(r.section) + '</td>' +
          '</tr>';
        }).join('');
        tbody.innerHTML = html;
      }
      count.textContent = filtered.length + ' of ' + ALL_ROWS.length + (q ? ' (filtered)' : '');
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
